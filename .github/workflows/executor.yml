# acme/ci-runner/.github/workflows/executor.yml
#
# This is the ONLY workflow file in the entire org.
# It's a generic executor that runs whatever the App tells it to.

name: CI Executor

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to clone (owner/name)'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (branch, tag, SHA)'
        required: true
        type: string
      sha:
        description: 'Commit SHA (for posting check runs)'
        required: true
        type: string
      job:
        description: 'JSON job descriptor'
        required: true
        type: string
      callback-url:
        description: 'URL to POST results back to'
        required: false
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    # Dynamic timeout from the job descriptor
    timeout-minutes: ${{ fromJson(inputs.job).timeout || 30 }}

    steps:
      - name: Generate App token for target repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MPR_APP_ID }}
          private-key: ${{ secrets.MPR_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.repo }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Post in-progress check run
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const job = JSON.parse('${{ inputs.job }}');
            const [owner, repo] = '${{ inputs.repo }}'.split('/');
            const { data } = await github.rest.checks.create({
              owner, repo,
              name: job.name,
              head_sha: '${{ inputs.sha }}',
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.exportVariable('CHECK_RUN_ID', data.id);

      - name: Setup environment
        run: |
          JOB='${{ inputs.job }}'
          NODE_VER=$(echo "$JOB" | jq -r '.node // "20"')
          echo "Setting up Node.js $NODE_VER"
        # In production: dynamic setup based on job descriptor
        # Could be Node, Python, Go, Rust, Docker, etc.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJson(inputs.job).node || '20' }}

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/tsc.json"
          echo "::add-matcher::.github/problem-matchers/eslint-compact.json"

      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies"
          if [ -f package-lock.json ]; then npm ci --loglevel=error
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile --silent
          elif [ -f pnpm-lock.yaml ]; then npx pnpm install --frozen-lockfile --silent
          elif [ -f package.json ]; then npm install --loglevel=error
          fi
          echo "::endgroup::"

      - name: Execute commands
        id: execute
        run: |
          JOB='${{ inputs.job }}'
          COMMANDS=$(echo "$JOB" | jq -r '.commands[]')

          EXIT=0
          OUTPUT=""

          echo "$COMMANDS" | while IFS= read -r cmd; do
            echo "::group::$ $cmd"
            if eval "$cmd"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Command failed: $cmd"
              EXIT=1
            fi
          done

          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          JOB='${{ inputs.job }}'
          JOB_NAME=$(echo "$JOB" | jq -r '.name')
          OUTCOME="${{ steps.execute.outcome }}"

          if [ "$OUTCOME" = "success" ]; then
            ICON="white_check_mark"
          else
            ICON="x"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## :${ICON}: ${JOB_NAME}

          | Field | Value |
          |-------|-------|
          | Repo | \`${{ inputs.repo }}\` |
          | Ref | \`${{ inputs.ref }}\` |
          | SHA | \`${{ inputs.sha }}\` |
          | Result | **${OUTCOME}** |

          <details>
          <summary>Job descriptor</summary>

          \`\`\`json
          $(echo "$JOB" | jq '.')
          \`\`\`

          </details>
          SUMMARY

      # If the job produces artifacts (coverage, builds, etc.)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJson(inputs.job).name }}-${{ inputs.sha }}
          path: ${{ fromJson(inputs.job).artifacts || 'coverage/' }}
          if-no-files-found: ignore

      - name: Post check run result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const job = JSON.parse('${{ inputs.job }}');
            const [owner, repo] = '${{ inputs.repo }}'.split('/');
            const passed = '${{ steps.execute.outcome }}' === 'success';

            await github.rest.checks.update({
              owner, repo,
              check_run_id: parseInt(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: passed ? 'Passed' : 'Failed',
                summary: `Job: **${job.name}**\nRepo: \`${{ inputs.repo }}\`\nRef: \`${{ inputs.ref }}\``,
              },
            });

      # Callback to the App server with results (optional)
      - name: Callback
        if: always() && inputs.callback-url
        run: |
          curl -sS -X POST "${{ inputs.callback-url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ inputs.repo }}",
              "sha": "${{ inputs.sha }}",
              "job": "${{ inputs.job }}",
              "passed": ${{ steps.execute.outcome == 'success' }}
            }'
